[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-image"
version = "0.1.0"
description = "Tiny PyTorch tensor image and video export utilities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "pillow",
    "imageio",
    "imageio-ffmpeg",
    "watchfiles",
]

[project.scripts]
tensor-image-watch = "tensor_image.watch:main"

[tool.setuptools.packages.find]
include = ["tensor_image*"]
